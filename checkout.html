<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Inscrição | PROTOCOLO DO SHAPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #e2ff00; --dark: #050505; --card: #111; }
        body { font-family: 'Inter', sans-serif; background-color: var(--dark); color: white; margin: 0; }
        h1, h2, h3, .font-oswald { font-family: 'Oswald', sans-serif; text-transform: uppercase; }
        
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-glow { transition: all 0.3s ease; }
        .btn-glow:hover { box-shadow: 0 0 40px var(--neon); transform: scale(1.02); }
        
        input { 
            background: #111 !important; 
            border: 1px solid #333 !important; 
            color: white !important; 
            transition: border 0.3s ease;
        }
        input:focus { border-color: var(--neon) !important; outline: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-12 lg:p-20">

    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-12 animate-fade">
            <a href="index.html" class="flex items-center gap-2 text-gray-500 hover:text-white transition-colors group">
                <svg class="w-5 h-5 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                <span class="font-bold uppercase text-xs tracking-widest">Voltar</span>
            </a>
            <div class="text-xl font-black italic tracking-tighter uppercase">
                PROTOCOLO<span class="text-[#e2ff00]">DO SHAPE</span>
            </div>
        </div>

        <div class="bg-red-500/10 border border-red-500/30 rounded-2xl p-4 flex flex-col items-center justify-center text-center shadow-[0_0_15px_rgba(239,68,68,0.15)] mb-10 animate-fade">
            <span class="text-xs uppercase tracking-widest text-red-400 font-bold mb-1">Seu desconto expira em:</span>
            <div class="text-3xl font-black font-oswald text-white tracking-wider flex items-center gap-2">
                <span id="timer-minutes" class="bg-red-500 text-black px-2 py-1 rounded">15</span>
                <span class="text-red-500">:</span>
                <span id="timer-seconds" class="bg-red-500 text-black px-2 py-1 rounded">00</span>
            </div>
        </div>

        <div class="grid lg:grid-cols-2 gap-12 lg:gap-20">
            <div class="animate-fade" style="animation-delay: 0.1s;">
                <h2 class="text-4xl md:text-5xl font-black italic mb-10 uppercase leading-none">
                    Finalizar <br><span class="text-[#e2ff00]">Inscrição</span>
                </h2>
                
                <form id="cakto-form" class="space-y-8">
                    <div class="space-y-4">
                        <h3 class="text-sm font-black uppercase text-gray-600 tracking-widest mb-4">Dados Pessoais</h3>
                        <input type="text" id="name" required placeholder="Nome Completo" class="w-full p-5 rounded-2xl font-bold text-lg">
                        <input type="email" id="email" required placeholder="E-mail Principal" class="w-full p-5 rounded-2xl font-bold text-lg">
                        <div class="grid md:grid-cols-2 gap-4">
                            <input type="tel" id="whatsapp" required placeholder="WhatsApp (DDD + Número)" class="w-full p-5 rounded-2xl font-bold text-lg">
                            <input type="text" id="cpf" required placeholder="CPF (Apenas números)" class="w-full p-5 rounded-2xl font-bold text-lg">
                        </div>
                    </div>
                    
                    <div class="space-y-4 pt-6 border-t border-white/5">
                        <h3 class="text-sm font-black uppercase text-gray-600 tracking-widest mb-4">Endereço de Faturamento</h3>
                        <input type="text" id="cep" required placeholder="CEP" class="w-full p-5 rounded-2xl font-bold text-lg">
                        <input type="text" id="street" required placeholder="Rua / Logradouro" class="w-full p-5 rounded-2xl font-bold text-lg">
                        <div class="grid md:grid-cols-2 gap-4">
                            <input type="text" id="number" required placeholder="Número" class="w-full p-5 rounded-2xl font-bold text-lg">
                            <input type="text" id="complement" placeholder="Complemento (Opcional)" class="w-full p-5 rounded-2xl font-bold text-lg">
                        </div>
                    </div>
                    
                    <button type="submit" class="w-full bg-[#e2ff00] text-black py-8 rounded-3xl font-black text-2xl uppercase italic btn-glow mt-10 flex items-center justify-center gap-4">
                        PAGAR AGORA
                    </button>
                </form>
            </div>

            <div class="self-start sticky top-10 animate-fade" style="animation-delay: 0.2s;">
                <div class="glass p-10 rounded-[40px] border border-[#e2ff00]/20">
                    <h3 class="text-2xl font-black mb-8 uppercase italic">Resumo do Pedido</h3>
                    
                    <div class="space-y-4 mb-8">
                        <div class="flex justify-between items-center">
                            <p class="font-bold">Protocolo do Shape</p>
                            <div class="text-right">
                                <span class="block text-sm text-gray-500 line-through">R$ 97,00</span>
                                <span class="block font-black text-xl text-[#e2ff00]">R$ 29,90</span>
                            </div>
                        </div>
                    </div>

                    <div class="border-t border-white/10 pt-6 flex justify-between items-center">
                        <span class="text-sm font-black uppercase text-gray-400">Total a Pagar:</span>
                        <span class="text-4xl font-black text-white italic">R$ 29,90</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateTimer() {
            const minElem = document.getElementById('timer-minutes');
            const secElem = document.getElementById('timer-seconds');
            let endTime = localStorage.getItem('shape_timer_end');
            if (!endTime) {
                endTime = Date.now() + (15 * 60 * 1000);
                localStorage.setItem('shape_timer_end', endTime);
            }
            const now = Date.now();
            let remainingMs = parseInt(endTime, 10) - now;
            if (remainingMs <= 0) remainingMs = 0;
            const m = Math.floor(remainingMs / 60000);
            const s = Math.floor((remainingMs % 60000) / 1000);
            minElem.innerText = m.toString().padStart(2, '0');
            secElem.innerText = s.toString().padStart(2, '0');
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        document.getElementById('cep').addEventListener('blur', function() {
            const cep = this.value.replace(/\D/g, '');
            if(cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(r => r.json())
                .then(d => {
                    if(!d.erro) {
                        document.getElementById('street').value = d.logradouro;
                        document.getElementById('number').focus();
                    }
                });
            }
        });

        document.getElementById('cakto-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const baseUrl = "https://pay.cakto.com.br/376mm6y_883600";
            const params = new URLSearchParams({
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('whatsapp').value.replace(/\D/g, ''),
                document: document.getElementById('cpf').value.replace(/\D/g, ''),
                zipcode: document.getElementById('cep').value.replace(/\D/g, ''),
                address: document.getElementById('street').value,
                address_number: document.getElementById('number').value,
                complement: document.getElementById('complement').value
            });
            window.location.href = `${baseUrl}?${params.toString()}`;
        });
    </script>
</body>
</html>
