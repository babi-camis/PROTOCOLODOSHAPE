<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Inscrição | PROTOCOLO DO SHAPE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --neon: #e2ff00; --dark: #050505; }
        body { font-family: 'Inter', sans-serif; background-color: var(--dark); color: white; }
        input { background: #111 !important; border: 1px solid #333 !important; color: white !important; }
        .btn-glow:hover { box-shadow: 0 0 40px var(--neon); transform: scale(1.02); }
    </style>
</head>
<body class="min-h-screen p-6 md:p-20">

    <div class="max-w-6xl mx-auto grid lg:grid-cols-2 gap-16">
        <div>
            <h2 class="text-4xl font-black italic mb-10 uppercase">Finalizar <span class="text-neon">Inscrição</span></h2>
            <form id="cakto-form" class="space-y-6">
                <div class="space-y-4">
                    <input type="text" id="name" required placeholder="Nome Completo" class="w-full p-5 rounded-2xl font-bold text-lg">
                    <input type="email" id="email" required placeholder="E-mail Principal" class="w-full p-5 rounded-2xl font-bold text-lg">
                    <input type="tel" id="whatsapp" required placeholder="WhatsApp (DDD + Número)" class="w-full p-5 rounded-2xl font-bold text-lg">
                    <input type="text" id="cpf" required placeholder="CPF (Apenas números)" class="w-full p-5 rounded-2xl font-bold text-lg">
                </div>
                
                <div class="pt-6 space-y-4">
                    <h3 class="text-xl font-black italic uppercase text-gray-500">Endereço</h3>
                    <input type="text" id="cep" required placeholder="CEP" class="w-full p-5 rounded-2xl font-bold text-lg">
                    <input type="text" id="street" required placeholder="Rua / Logradouro" class="w-full p-5 rounded-2xl font-bold text-lg">
                    <input type="text" id="number" required placeholder="Número" class="w-full p-5 rounded-2xl font-bold text-lg">
                </div>

                <button type="submit" class="w-full bg-neon text-black py-8 rounded-3xl font-black text-2xl uppercase italic btn-glow mt-10">
                    PAGAR AGORA
                </button>
            </form>
        </div>

        <div class="bg-white/5 p-10 rounded-[40px] border border-white/5 self-start sticky top-10">
            <h3 class="text-2xl font-black mb-8 uppercase italic">Resumo</h3>
            <div class="flex justify-between items-center mb-4">
                <span>Protocolo do Shape</span>
                <span class="font-bold">R$ 29,90</span>
            </div>
            <div class="border-t border-white/5 pt-4 text-xs text-gray-500 uppercase font-bold tracking-widest">
                Acesso Imediato • 100% Seguro
            </div>
        </div>
    </div>

    <script>
    document.getElementById('cakto-form').addEventListener('submit', function(e) {
        e.preventDefault();

        // LIMPEZA DE DADOS: Remove tudo que não for número para evitar erros na API
        const phone = document.getElementById('whatsapp').value.replace(/\D/g, '');
        const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
        const zip = document.getElementById('cep').value.replace(/\D/g, '');
        
        const baseUrl = "https://pay.cakto.com.br/376mm6y_883600";
        
        // Mapeamento exato de parâmetros que gateways brasileiros costumam aceitar
        const params = new URLSearchParams({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            phone: phone,
            document: cpf,
            zipcode: zip,
            address: document.getElementById('street').value,
            address_number: document.getElementById('number').value
        });

        const finalUrl = `${baseUrl}?${params.toString()}`;
        
        // Redirecionamento imediato
        window.location.href = finalUrl;
    });

    document.getElementById('cep').addEventListener('blur', function() {
        const cep = this.value.replace(/\D/g, '');
        if(cep.length === 8) {
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(r => r.json())
                .then(d => {
                    if(!d.erro) {
                        document.getElementById('street').value = d.logradouro;
                    }
                });
        }
    });
    </script>
</body>
</html>
